name: Release APK

# Builds the Android APK in CI and attaches it to a GitHub Release so users can
# download/install it on a phone with one tap.
#
# Two ways to trigger:
#   1. Push a version tag:        git tag v1.0.0 && git push origin v1.0.0
#   2. Manual: Actions -> "Release APK" -> "Run workflow" (uses the default
#      branch; produces a rolling "latest" pre-release).
#
# No secrets are needed — the debug APK is signed with Android's built-in debug
# key, which is fine for side-loading on your own devices. Add a real keystore
# (and the matching secrets) only when you want a distributable release build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/edit the GitHub Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install frontend deps
        run: npm ci || npm install

      - name: Build static web bundle (Capacitor export)
        run: npm run build:mobile

      - name: Sync web bundle into Android project
        # `cap copy` only copies the static bundle + regenerates
        # capacitor.config.json — it never touches Gradle, unlike `cap sync`
        # which can probe the toolchain and fail on a fresh clone.
        run: npx cap copy android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --console=plain

      - name: Rename APK
        working-directory: frontend
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "carenet-mesh.apk"
          ls -la carenet-mesh.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carenet-mesh-apk
          path: frontend/carenet-mesh.apk
          retention-days: 30

      - name: Create / update "latest" release with APK
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CareNet Mesh — Latest APK
          prerelease: true
          files: frontend/carenet-mesh.apk

      - name: Attach APK to version-tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CareNet Mesh ${{ github.ref_name }}
          prerelease: false
          files: frontend/carenet-mesh.apk
