name: Release APK

# Builds the Android APK in CI and attaches it to a GitHub Release so users can
# download/install it on a phone with one tap.
#
# Two ways to trigger:
#   1. Push a version tag:        git tag v1.0.0 && git push origin v1.0.0
#   2. Manual: Actions -> "Release APK" -> "Run workflow" (uses the default
#      branch; produces a rolling "latest" pre-release).
#
# No secrets are needed — the debug APK is signed with Android's built-in debug
# key, which is fine for side-loading on your own devices. Add a real keystore
# (and the matching secrets) only when you want a distributable release build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/edit the GitHub Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install frontend deps
        run: npm ci || npm install

      - name: Build static web bundle (Capacitor export)
        run: npm run build:mobile

      - name: Copy web bundle into Android project
        # Replicates `cap copy` (static bundle + capacitor.config.json) without
        # invoking the Capacitor CLI, which can fail on a cold CI clone. Pure
        # Node/fs copy — deterministic and dependency-free.
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dst = path.join("android","app","src","main","assets");
            const pubDst = path.join(dst, "public");
            fs.rmSync(pubDst, { recursive: true, force: true });
            fs.mkdirSync(pubDst, { recursive: true });
            fs.cpSync("out", pubDst, { recursive: true });
            const cfg = {
              appId: "com.rempm.mesh",
              appName: "CareNet Mesh",
              webDir: "out",
              server: { cleartext: true },
              android: { allowMixedContent: true },
              plugins: { SplashScreen: { launchShowDuration: 1200, backgroundColor: "#050505", showSpinner: false } },
            };
            fs.writeFileSync(path.join(dst, "capacitor.config.json"), JSON.stringify(cfg, null, "\t"));
            fs.writeFileSync(path.join(dst, "capacitor.plugins.json"), "[]");
            console.log("web bundle copied into", pubDst);
          '

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          # setup-android puts the SDK in $ANDROID_SDK_ROOT (and/or ANDROID_HOME).
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Resolved SDK dir: $SDK"
          ls "$SDK" || true
          # Write local.properties so Gradle resolves the SDK even if env is unset.
          echo "sdk.dir=$SDK" > local.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain --stacktrace

      - name: Rename APK
        working-directory: frontend
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "carenet-mesh.apk"
          ls -la carenet-mesh.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carenet-mesh-apk
          path: frontend/carenet-mesh.apk
          retention-days: 30

      - name: Create / update "latest" release with APK
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CareNet Mesh — Latest APK
          prerelease: true
          files: frontend/carenet-mesh.apk

      - name: Attach APK to version-tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CareNet Mesh ${{ github.ref_name }}
          prerelease: false
          files: frontend/carenet-mesh.apk
